<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TV Live — {{ strategy }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='tv.css') }}">
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div id="layout">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span class="name">TV Live</span>
        <span class="sep">/</span>
        <span class="pair" id="symbol-label">--</span>
        <span class="tf" id="tf-label">--</span>
      </div>
      <div class="selectors">
        <label>
          Estratégia
          <select id="strategy-select">
            {% for s in strategies %}
            <option value="{{ s }}" {% if s==strategy %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Timeframe
          <select id="timeframe-select">
            {% for tf in timeframes %}
            <option value="{{ tf }}">{{ tf }}</option>
            {% endfor %}
          </select>
        </label>
        <button id="reload-btn">Atualizar</button>
      </div>
      <div class="playback">
        <button id="play-btn">Play</button>
        <input type="range" id="progress-range" min="0" max="100" value="0" />
      </div>
      <div class="price-box">
        <div class="side sell">Venda <span id="price-sell">--</span></div>
        <div class="side buy">Compra <span id="price-buy">--</span></div>
      </div>
    </header>
    <aside class="toolbar">
      <div class="tool">╋</div>
      <div class="tool">⇄</div>
      <div class="tool">◆</div>
      <div class="tool">✎</div>
      <div class="tool">⌖</div>
      <div class="tool">⚙</div>
    </aside>
    <main class="chart-area">
      <div id="chart"></div>
      <div class="time-buttons">
        <button data-tf="1m">1M</button>
        <button data-tf="5m">5M</button>
        <button data-tf="15m">15M</button>
        <button data-tf="1h">1H</button>
        <button data-tf="4h">4H</button>
        <button data-tf="1d" class="active">1D</button>
      </div>
    </main>
    <aside class="watchlist">
      <div class="watchlist-header">Watchlist</div>
      <div class="watchlist-body" id="watchlist-body">
        <!-- preenchido via JS -->
      </div>
      <div class="stats-card">
        <div class="stat-row">
          <div class="label">Dívida</div>
          <div class="value" id="debt-value">--</div>
        </div>
        <div class="bar"><div class="fill debt" id="debt-bar"></div></div>
        <div class="stat-row">
          <div class="label">Bônus</div>
          <div class="value" id="bonus-value">--</div>
        </div>
        <div class="bar"><div class="fill bonus" id="bonus-bar"></div></div>
        <div class="stat-row">
          <div class="label">Dinheiro</div>
          <div class="value" id="cash-value">--</div>
        </div>
        <div class="bar"><div class="fill cash" id="cash-bar"></div></div>
        <div class="stat-row">
          <div class="label">Dias restantes</div>
          <div class="value" id="days-value">--</div>
        </div>
        <div class="bar"><div class="fill days" id="days-bar"></div></div>
        <div class="stat-row">
          <div class="label">Vidas</div>
          <div class="value" id="lives-value">--</div>
        </div>
        <div class="bar"><div class="fill lives" id="lives-bar"></div></div>
        <div class="mood">
          <span id="mood-face">😐</span>
          <span id="mood-text">Neutral</span>
        </div>
        <div class="mood-counts">
          <div>feliz: <span id="mood-count-happy">0</span></div>
          <div>triste: <span id="mood-count-sad">0</span></div>
          <div>neutro: <span id="mood-count-neutral">0</span></div>
        </div>
      </div>
      <div class="stats-card">
        <div class="card-title">Especialistas</div>
        <div id="experts-list" class="experts-list">
          <!-- preenchido via JS -->
        </div>
        <div class="gate-info">
          <div>Gate top-k: <span id="gate-topk">--</span></div>
          <div>Long/Short: <span id="gate-modes">--</span></div>
        </div>
      </div>
    </aside>
  </div>
  <script>
    const CONFIG = {
      defaultStrategy: "{{ strategy }}",
    };
  </script>
  <script src="{{ url_for('static', filename='tv.js') }}"></script>
</body>
</html>
