[project]
name = "teste-previsao3"
version = "0.1.0"
description = ""
authors = [
    {name = "davidsc",email = "davidsc@zanotti.com.br"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=1.24.3,<2.3)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "yfinance (>=0.2.66,<0.3.0)",
    "pytz (>=2025.2,<2026.0)",
    "optune (>=0.1.1,<0.2.0)",
    "ta-lib (>=0.6.7,<0.7.0)",
    "requests (>=2.32.5,<3.0.0)",
    "optuna (>=4.6.0,<5.0.0)",
    "python-binance (>=1.0.34,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
]

# Optional heavy deps, installed on demand (reduce default provision time)
[project.optional-dependencies]
tf = [
    "tensorflow (>=2.20.0,<3.0.0)",
]
web = [
    "flask (>=3.0.3,<4.0.0)",
]

[tool.poetry]
packages = [{include = "teste_previsao2", from = "src"}]


[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
djlint = "^1.36.4"
pytest = "^8.4.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
